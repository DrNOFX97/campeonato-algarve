<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campeonato do Algarve</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1>Campeonato do Algarve</h1>
    <p class="epoca">Época 2026/2027</p>
  </div>
</header>

<nav class="menu-principal" aria-label="Secções">
  <div class="menu-inner">
    <button class="menu-item" data-painel="classificacao">Classificação</button>
    <button class="menu-item" data-painel="jornadas">Jornadas</button>
    <button class="menu-item" data-painel="jogadores">Jogadores</button>
    <button class="menu-item" data-painel="clubes">Clubes</button>
    <button class="menu-item" data-painel="estatisticas">Estatísticas</button>
  </div>
</nav>

<div id="banner-erro" class="banner-erro" hidden></div>

<main>

  <section id="painel-classificacao" class="painel" data-painel="classificacao" aria-labelledby="titulo-classificacao">
    <h2 id="titulo-classificacao">Classificação</h2>
    <div class="tabela-scroll">
      <table id="tabela-classificacao">
        <thead>
          <tr>
            <th scope="col" class="col-pos">#</th>
            <th scope="col" class="col-clube">Clube</th>
            <th scope="col">J</th>
            <th scope="col">V</th>
            <th scope="col">E</th>
            <th scope="col">D</th>
            <th scope="col">GM</th>
            <th scope="col">GS</th>
            <th scope="col">DG</th>
            <th scope="col" class="col-pontos">Pts</th>
          </tr>
        </thead>
        <tbody id="corpo-classificacao"></tbody>
      </table>
    </div>
  </section>

  <section id="painel-jornadas" class="painel" data-painel="jornadas" aria-label="Jornadas">
    <h2>Jornadas</h2>
    <div id="estado-vazio" class="estado-vazio" hidden>
      <p>Ainda não há calendário para esta época.</p>
      <button id="btn-gerar-calendario" class="btn btn-ouro">Gerar calendário</button>
    </div>
    <div id="jornadas" class="jornadas"></div>
  </section>

  <section id="painel-jogadores" class="painel" data-painel="jogadores" aria-labelledby="titulo-jogadores">
    <h2 id="titulo-jogadores">Jogadores</h2>
    <div class="filtros">
      <input type="search" id="filtro-jogador-nome" class="campo-filtro" placeholder="Pesquisar por nome...">
      <select id="filtro-jogador-clube" class="campo-filtro"><option value="">Todos os clubes</option></select>
      <select id="filtro-jogador-posicao" class="campo-filtro"><option value="">Todas as posições</option></select>
      <select id="filtro-jogador-nacionalidade" class="campo-filtro"><option value="">Todas as nacionalidades</option></select>
    </div>
    <p id="contagem-jogadores" class="contagem-resultados"></p>
    <div class="tabela-scroll">
      <table id="tabela-jogadores">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Nome</th>
            <th scope="col">Clube</th>
            <th scope="col">Posição</th>
            <th scope="col">Nacionalidade</th>
            <th scope="col">Nascimento</th>
          </tr>
        </thead>
        <tbody id="corpo-jogadores"></tbody>
      </table>
    </div>
  </section>

  <section id="painel-clubes" class="painel" data-painel="clubes" aria-labelledby="titulo-clubes">
    <h2 id="titulo-clubes">Clubes</h2>
    <div id="grelha-clubes" class="grelha-clubes"></div>
  </section>

  <section id="painel-estatisticas" class="painel" data-painel="estatisticas" aria-labelledby="titulo-estatisticas">
    <h2 id="titulo-estatisticas">Estatísticas</h2>
    <div id="resumo-estatisticas" class="resumo-estatisticas"></div>
    <div class="grelha-graficos">
      <div class="cartao-grafico">
        <h3>Topo marcadores</h3>
        <div id="grafico-marcadores" class="grafico-barras"></div>
      </div>
      <div class="cartao-grafico">
        <h3>Topo cartões</h3>
        <div id="grafico-cartoes" class="grafico-barras"></div>
      </div>
      <div class="cartao-grafico">
        <h3>Golos por jornada</h3>
        <div id="grafico-jornadas" class="grafico-barras"></div>
      </div>
      <div class="cartao-grafico">
        <h3>Golos por posição</h3>
        <div id="grafico-posicao" class="grafico-barras"></div>
      </div>
    </div>
  </section>

</main>

<footer class="rodape">
  <button id="btn-reiniciar" class="btn btn-fantasma">Reiniciar época</button>
</footer>

<script src="app.js"></script>
</body>
</html>
